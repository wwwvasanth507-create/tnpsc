{% extends 'base.html' %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="card p-8 bg-slate-900/90 border border-slate-800 shadow-2xl rounded-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-100">Join TNPSC 2A MASTER</h1>
            <p class="text-sm text-slate-400 mt-1">Start your structured exam prep journey today</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4">
            <div>
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-input" placeholder="e.g. Anitha Ramesh" required>
            </div>

            <div>
                <label for="username" class="form-label">Choose Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="e.g. anitha_tnpsc" required>
            </div>

            <div>
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="e.g. anitha@example.com" required>
            </div>

            <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Min. 6 characters" minlength="6" required>
            </div>

            <div>
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter password" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary w-full py-3 text-base font-semibold shadow-lg shadow-indigo-600/25 mt-2">
                Create Aspirant Account
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
            Already registered? 
            <a href="{{ url_for('auth.login') }}" class="text-indigo-400 hover:text-indigo-300 font-semibold ml-1">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
