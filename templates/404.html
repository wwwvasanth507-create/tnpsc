{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center">
    <div class="w-20 h-20 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 text-4xl font-extrabold mb-6">
        404
    </div>
    <h1 class="text-3xl font-bold text-slate-100 mb-2">Page Not Found</h1>
    <p class="text-slate-400 max-w-md mb-6">The page or resource you are looking for does not exist or has been moved.</p>
    <a href="{% if is_logged_in %}{% if current_user_role == 'admin' %}{{ url_for('admin.dashboard') }}{% else %}{{ url_for('student.dashboard') }}{% endif %}{% else %}{{ url_for('auth.login') }}{% endif %}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
