{% extends 'base.html' %}
{% block title %}500 - Server Error{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center">
    <div class="w-20 h-20 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-4xl font-extrabold mb-6">
        500
    </div>
    <h1 class="text-3xl font-bold text-slate-100 mb-2">Internal Server Error</h1>
    <p class="text-slate-400 max-w-md mb-6">An unexpected error occurred while processing your request. Please try again in a few moments.</p>
    <a href="{% if is_logged_in %}{{ url_for('student.dashboard') }}{% else %}{{ url_for('auth.login') }}{% endif %}" class="btn btn-primary">Return to Safety</a>
</div>
{% endblock %}
